<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MailMate Tracker</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      font-size: 13px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
    }

    .status-badge.online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .online .dot { background: #34d399; }
    .offline .dot { background: #f87171; }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      color: #fff;
      padding: 7px 10px;
      font-size: 12px;
      box-sizing: border-box;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #6366f1;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      opacity: 0.92;
      transform: translateY(-0.5px);
    }

    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      margin-top: 6px;
      border: 1px solid #334155;
    }

    .btn-secondary:hover {
      background: #334155;
      color: #fff;
    }

    .saved-msg {
      color: #34d399;
      font-size: 10px;
      text-align: center;
      margin-top: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">M</div>
      <span class="brand-title">MailMate</span>
    </div>
    <div id="statusBadge" class="status-badge offline">
      <span class="dot"></span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div class="field">
    <label for="serverUrl">MailMate Server URL (Tunnel or Local):</label>
    <input type="text" id="serverUrl" placeholder="http://localhost:5000 or https://xyz.loca.lt" />
  </div>

  <label class="checkbox-row">
    <input type="checkbox" id="trackDefault" checked />
    <span>Automatically track emails by default</span>
  </label>

  <button id="saveBtn" class="btn">Save Configuration</button>
  <div id="savedMsg" class="saved-msg">✓ Settings Saved</div>

  <button id="openDashboardBtn" class="btn btn-secondary">Open Web Dashboard ↗</button>

  <script src="popup.js"></script>
</body>
</html>
